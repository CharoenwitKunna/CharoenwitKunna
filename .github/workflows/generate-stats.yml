name: Refresh profile activity cards

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate_stats.py"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: CharoenwitKunna
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-card.svg top-langs.svg
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh stats cards"
          git push
